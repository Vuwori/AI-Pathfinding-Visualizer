name: Release

# Pushing a version tag (for example v1.0.0) builds the runnable jar,
# runs the tests and publishes both as a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: target/pathfinding-visualizer.jar
          generate_release_notes: true
